apiVersion: v1
kind: Service
metadata:
  name: sap-proxy-agent-hub-svc
  labels:
    app: sap-proxy-agent-hub
spec:
  type: LoadBalancer
  selector:
    app: sap-proxy-agent-hub
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: grpc-bootstrap
      port: 50052
      targetPort: 50052
      protocol: TCP
    # TCP forward (sidecar on hub pod) → sap-proxy-agent-unary-svc:50053 — same LB IP as :50051
    - name: grpc-unary
      port: 50053
      targetPort: 50053
      protocol: TCP
